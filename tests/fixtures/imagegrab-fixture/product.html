<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>本地演示商品详情</title>
  <style>
    body { margin: 0; background: #f6f4ef; color: #172033; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { width: min(980px, calc(100% - 40px)); margin: 28px auto; }
    .card { display: grid; grid-template-columns: 420px 1fr; gap: 28px; padding: 24px; border-radius: 20px; background: white; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .price { margin: 0 0 16px; color: #1f4bff; font-size: 24px; font-weight: 700; }
    img { width: 120px; height: 90px; object-fit: cover; border-radius: 12px; background: #eee; }
    .main-photo { width: 100%; height: 280px; }
    .hero { display: block; width: 100%; height: 220px; margin-top: 12px; background: #ddd url("images/bg.png") center/cover; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    p { line-height: 1.7; color: #667085; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div>
        <img class="main-photo" alt="主图" data-src="images/hero.png" src="images/placeholder.gif">
        <div class="hero" style="background-image: url('images/bg.png')"></div>
      </div>
      <div>
        <h1>演示商品</h1>
        <p class="price">¥ 129.00</p>
        <p>这是本地商品详情页，用来检查右下角按钮、懒加载图片、背景图和描述 iframe。</p>
        <div class="row">
          <img alt="详情" data-lazy-src="images/detail.png" src="images/tiny.png">
          <img alt="响应图" srcset="images/srcset-small.png 120w, images/srcset-large.png 640w">
          <img alt="网站标志" src="images/logo.png">
          <img alt="小图标" src="images/tiny.png" width="16" height="16">
        </div>
      </div>
    </section>
    <iframe src="frame.html" width="100%" height="220" title="详情描述" style="margin-top:16px;border:0;border-radius:16px;background:white"></iframe>
  </main>
</body>
</html>
